<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
<div class="bg-white p-8 rounded-lg shadow-md w-80 text-center">
    <h1 class="text-2xl font-bold mb-6">로그인</h1>

    <a href="/oauth2/authorization/kakao"
       class="block mb-4 py-2 px-4 bg-yellow-400 hover:bg-yellow-500 rounded text-white font-semibold">
        카카오 로그인
    </a>

    <a href="/oauth2/authorization/google"
       class="block mb-4 py-2 px-4 bg-red-500 hover:bg-red-600 rounded text-white font-semibold">
        구글 로그인
    </a>

    <a href="/oauth2/authorization/naver"
       class="block py-2 px-4 bg-green-500 hover:bg-green-600 rounded text-white font-semibold">
        네이버 로그인
    </a>
</div>
</body>
</html>
